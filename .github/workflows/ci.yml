name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR supersedes its running checks; main runs always finish so
# the Rust cache they save stays current.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build

  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      # Same system packages as the release build: webkit/gtk for Tauri, and
      # libmpv-dev for the embedded player (24.04 ships libmpv2, ADR 0008).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev

      # tauri-build checks that the ffmpeg/ffprobe sidecars exist at compile
      # time; they are fetched, not committed (src-tauri/binaries/README.md).
      - name: Fetch ffmpeg/ffprobe sidecars
        working-directory: .
        run: bash scripts/fetch-sidecars.sh

      # The crate lives in src-tauri/, not the repo root. Only main saves the
      # cache; PRs restore main's (GitHub scopes caches to the branch plus the
      # default branch), so PR runs don't evict each other.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # dev-tools builds the eval-harness and detect-dump CLIs too, so a change
      # that breaks them fails here rather than at the next eval run.
      - name: Test
        run: cargo test --locked --features dev-tools
